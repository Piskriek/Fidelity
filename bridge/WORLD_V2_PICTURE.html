<!doctype html>
<html lang="en">
<head>

<title>World v2 picture</title>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
--cS:#2a78d6;--cG:#eb6834;--cM:#1baf7a;--cT:#eda100;--cH:#e87ba4;--cB:#008300;--gain:#2a78d6;--pain:#e34948;--miss:#d03b3b;--dotline:rgba(11,11,11,.55);--tile:rgba(11,11,11,.045)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
--cS:#3987e5;--cG:#d95926;--cM:#199e70;--cT:#c98500;--cH:#d55181;--cB:#008300;--gain:#3987e5;--pain:#e66767;--miss:#e66767;--dotline:rgba(240,239,236,.6);--tile:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
--cS:#3987e5;--cG:#d95926;--cM:#199e70;--cT:#c98500;--cH:#d55181;--cB:#008300;--gain:#3987e5;--pain:#e66767;--miss:#e66767;--dotline:rgba(240,239,236,.6);--tile:rgba(255,255,255,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px 16px 60px}
main{max-width:1240px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 0 14px}
.top h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.01em}
.key{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--ink2);font-size:12px}
.key span{display:inline-flex;align-items:center;gap:5px}
.sec{background:transparent;margin:0 0 22px}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:var(--ink2)}
.sh .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--axis);display:grid;place-items:center;font-weight:650;color:var(--ink)}
.ic{display:block}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(372px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:10px 10px 12px;--gc:var(--cS);overflow-x:auto}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--ink2)}
.ph b{color:var(--ink);font-size:14px}
.ph .sw{width:14px;height:14px;border-radius:50%;background:var(--gc);border:1.5px solid var(--dotline)}
.mx{display:grid;grid-template-columns:24px repeat(8,minmax(40px,1fr));gap:2px}
.mx>*{min-width:0}
.rh,.chd{display:grid;place-items:center;color:var(--muted);min-height:22px}
.c{min-height:26px;display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;padding:3px;border-radius:5px;background:var(--tile)}
.c.gap{margin-top:5px}
.rh.gap{margin-top:5px}
.d{width:15px;height:15px;border-radius:50%;background:var(--gc);border:1.5px solid var(--dotline);cursor:default;padding:0}
.d.nc{background:transparent;border:2px dashed var(--gc)}
.d:hover,.d:focus-visible,[data-tip]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.bar{display:block}
.unitwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.unit{max-width:100%;overflow-x:auto}
.unit{display:grid;grid-template-columns:64px repeat(5,92px);gap:6px;align-items:center;background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:10px 12px}
.uh{display:grid;place-items:center;color:var(--ink2);min-height:34px}
.ul{display:grid;place-items:center;color:var(--ink2)}
.u{display:grid;place-items:center;padding:8px 0;border-radius:12px}
.u.edge{background:color-mix(in srgb,var(--miss) 8%,transparent)}
.uc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.uc.ok{background:var(--cS);color:#fff}
.uc.part{border:2px solid var(--cS);background:linear-gradient(90deg,var(--cS) 50%,transparent 50%);color:transparent}
.uc.miss{border:2px dashed var(--miss);color:var(--miss);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--miss) 20%,transparent)}}
@media (prefers-reduced-motion:reduce){.uc.miss{animation:none}}
.loop{grid-column:1/-1;margin:0 0 -2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px 12px 14px}
.card.wide{grid-column:1/-1}
.cid{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.05em;color:var(--ink2);margin:0 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.opt{position:relative;width:74px;height:74px;border-radius:14px;border:1.5px solid var(--axis);display:grid;place-items:center;color:var(--ink2);opacity:.62}
.opt.rec{opacity:1;border:3px solid var(--ink);color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.opt.also{opacity:1;border:2px dashed var(--ink);color:var(--ink)}
.opt.sub{opacity:1;border:1.5px solid var(--axis);color:var(--ink)}
.opt.rec::after{content:"\2605";position:absolute;top:-11px;right:-9px;background:var(--ink);color:var(--surface);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1}
.opt .no{position:absolute;left:-7px;top:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--surface);border:1.5px solid var(--ink2);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.arr{color:var(--muted)}
.pill{display:inline-flex;border:1.5px solid var(--axis);border-radius:999px;overflow:hidden}
.pill .e{width:34px;height:28px;display:grid;place-items:center;color:var(--muted)}
.pill .e.rec{background:var(--ink);color:var(--surface)}
.pill.big .e{width:44px;height:34px}
.sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px}
.swi{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.swi .ic{flex:none}
.bars3{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.bx{border:1.5px solid var(--axis);border-radius:12px;padding:6px 8px 4px;position:relative;opacity:.65}
.bx.rec{opacity:1;border:3px solid var(--ink)}
.bx.rec::after{content:"\2605";position:absolute;top:-11px;right:-9px;background:var(--ink);color:var(--surface);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.bx.also{opacity:1;border:2px dashed var(--ink)}
.bx.sub{opacity:1}
.hb{display:flex;align-items:center;gap:8px;margin:4px 0;color:var(--ink2);font-variant-numeric:tabular-nums}
.hb .t{flex:1;height:12px;background:var(--tile);border-radius:6px;position:relative;min-width:120px}
.hb .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--gain)}
.hb.rec .f{outline:2px solid var(--ink);outline-offset:1px}
.hb .v{width:34px;text-align:right}
#tip{position:fixed;display:none;z-index:9;max-width:340px;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.4;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.28)}
#tip .h{font-weight:650;margin-bottom:3px}
#tip div+div{margin-top:2px}
@media (max-width:620px){.panels{grid-template-columns:1fr}.mx{grid-template-columns:22px repeat(8,minmax(30px,1fr))}.unit{grid-template-columns:40px repeat(5,minmax(46px,1fr));width:100%}.uc{width:38px;height:38px}.loop svg{display:none}.cards{grid-template-columns:1fr}}
</style>

<script>
var D = {"rows":[{"id":"S1","g":"S","cc":"a+","land":"sense","ra":1,"tip":"S1 · Telepathy as a starting skill that varies by kind of entity\ncost: a+\nin the beings' world: A sense profile declared at birth lists which senses a being starts with open. The nearest world form of telepathy is the witness (S9). See section 3\nRa: silent, partly, follows\nrulings: F, J (profiles are described by fit, never ranked), L (the profile…"},{"id":"S2","g":"S","cc":"a","land":"sense","ra":0,"tip":"S2 · The veil\ncost: a\nin the beings' world: The view already drops things by declaration (other valleys, the season, exact E and H, intensity). A \"veil\" is that declared list; a sense opens when an entry leaves it\nRa: not checked\nrulings: L (every dropped or noisy value must be declared), P (a veil is not…"},{"id":"S3","g":"S","cc":"a+","land":"sense","ra":1,"tip":"S3 · Senses widen as the stage rises\ncost: a+\nin the beings' world: A sense opens only when a being's higher self asks and the engine part permits, not on a stage timer (a timer would reward no-collapse seasons by widening the view). See WORLD_V2_DESIGN.md §1 and question N-2\nRa: silent, follows\nrulings: J, A, P (candidate, not a ruling: a range that widens only by choice…"},{"id":"S4","g":"S","cc":"none","land":"none","ra":0,"tip":"S4 · Sensing charge, light (Lx) and water (Aq)\ncost: none\nin the beings' world: None. This world has energy and health, already sensed\nRa: not checked\nrulings: –"},{"id":"S5","g":"S","cc":"a+","land":"sense","ra":1,"tip":"S5 · Declared sight and vessel-bounded awareness\ncost: a+\nin the beings' world: The being's open senses are a declared list set before the life (like chose=), widened only by an ask\nRa: partly\nrulings: A, L, P (analogy)"},{"id":"S6","g":"S","cc":"lens","land":"action","ra":1,"tip":"S6 · Observer ladder and permission profile\ncost: lens now; rule for attention\nin the beings' world: For the seat and the lens: every look returns what was dropped and why. For a being: attention, choosing where to look. A look is an ask; the other's permit makes it seen\nRa: partly\nrulings: A, L"},{"id":"S7","g":"S","cc":"run","land":"running","ra":0,"tip":"S7 · Fear as information\ncost: run\nin the beings' world: Running: the warnings are exact functions of the bands, not a separate sense\nRa: not checked\nrulings: P"},{"id":"S8","g":"S","cc":"a+","land":"sense","ra":1,"tip":"S8 · Inner state visible\ncost: a+\nin the beings' world: A being sees a neighbour's guess, not only its outcome. Today's help channel already shares a donor's inner vector (the bus, 25% of 64-tick segments, gated by the receiver)\nRa: follows\nrulings: A, C, J"},{"id":"S9","g":"S","cc":"a+","land":"sense","ra":1,"tip":"S9 · The witness: what another valley's being just got from this fruit kind\ncost: a+ (the world records last outcome and tick per valley and kind)\nin the beings' world: A sense: for the kind in front of me, the class (FED, PLAIN, TOXIC) of the most recent eat of that kind by another valley in the last 4 or 16 ticks\nRa: partly\nrulings: A (C-5: default-open, or the other gives and I ask), C, J, L"},{"id":"S10","g":"S","cc":"a","land":"sense","ra":0,"tip":"S10 · A being told the season turned\ncost: a\nin the beings' world: A sense: a one-tick \"turned\" flag, or age in 3 bins\nRa: not checked\nrulings: J (announcing it changes what E1 and M3 measure)"},{"id":"S11","g":"S","cc":"rule","land":"action","ra":0,"tip":"S11 · Excitement compass and breadcrumb attractors\ncost: rule\nin the beings' world: The surprise number already exists in the being (the sting). A candidate choice-rule change: an exploration pull from surprise in place of the fixed 1-in-10 random explore\nRa: not checked\nrulings: J (curiosity is not worth), O (what counts as better is the owner's…"},{"id":"G1","g":"G","cc":"a+","land":"sense","ra":1,"tip":"G1 · Telepathy as the way into a social memory complex\ncost: a+\nin the beings' world: Members' traces pooled: each sees the last outcome any member got for a kind\nRa: partly\nrulings: A (membership needs each member's yes), C, J"},{"id":"G2","g":"G","cc":"none","land":"none","ra":0,"tip":"G2 · The VSA-4096 \"quantum entanglement\" bus\ncost: none\nin the beings' world: Nothing like it in this world. The nearest running part is the help bus (S8), which carries a 64-number vector, not a 4096-bit VSA, so the two are not the same thing. MarbleGp has a spec for entanglement only with the native's…\nRa: not checked\nrulings: A (consent)"},{"id":"G3","g":"G","cc":"none","land":"world","ra":1,"tip":"G3 · Social memory complex pooling at coherence ≥ 0.95; circle coherence with an STO/STS…\ncost: none until groups exist (then a+ plus rule)\nin the beings' world: A group state. This world has no groups larger than one donor and one receiver\nRa: partly\nrulings: A, J (a 0.95 pass mark reads as a grade; keep the mechanic as fit), C"},{"id":"G4","g":"G","cc":"a+","land":"sense","ra":1,"tip":"G4 · The group grows as density changes\ncost: a+\nin the beings' world: A ladder of what is shared (the depth reading is lookup 6's guide synthesis, not the owner's words; the owner decides whether \"grows\" means depth): my own outcome; a neighbour's outcome; a neighbour's guess; a pooled trace. The…\nRa: partly, follows, silent, departs in part\nrulings: F, A, J"},{"id":"G5","g":"G","cc":"rule","land":"world","ra":1,"tip":"G5 · Dyads, triads and nested 3/6/9\ncost: rule + a+; a new world version\nin the beings' world: Groups of 3 or 4 with an open seat flag, filled only on the group's call\nRa: follows\nrulings: A, C, J (no \"balanced partner\" worth gate)"},{"id":"G6","g":"G","cc":"none","land":"port","ra":1,"tip":"G6 · Harmonious doubling of a group's call, 2^(N−1)\ncost: none until an ask arm and groups exist\nin the beings' world: Used in the ask arm: how strongly the engine may answer a group's call\nRa: partly\nrulings: A, J (the answer is not a reward to maximise)"},{"id":"G7","g":"G","cc":"none","land":"none","ra":0,"tip":"G7 · Planets as presets: a very dense soul moving through the densities\ncost: none\nin the beings' world: None here (a later stage)\nRa: not checked\nrulings: –"},{"id":"M1","g":"M","cc":"none","land":"later","ra":1,"tip":"M1 · The distilled bias record and episodes\ncost: none (stage 2)\nin the beings' world: Across lives: the soul line at each life's end. Within a life: the kind trace (M2)\nRa: follows\nrulings: P, L"},{"id":"M2","g":"M","cc":"a+","land":"sense","ra":0,"tip":"M2 · The kind trace: what this fruit did to me last time\ncost: a+ (the trace must sit in the declared snapshot so the token checks can run)\nin the beings' world: A sense: for the fruit in front of me, the class of my own last eat of that kind, with an age band\nRa: not checked\nrulings: L, J (the classes are the world's own effect names)"},{"id":"M3","g":"M","cc":"a+","land":"sense","ra":1,"tip":"M3 · Social memory: all of each entity's experience open to the whole\ncost: a+\nin the beings' world: See G1 and G4\nRa: follows\nrulings: A, C"},{"id":"M4","g":"M","cc":"run","land":"running","ra":0,"tip":"M4 · KL-regularised predictive loss and the SQ-JEPA latent rollout\ncost: run\nin the beings' world: Running in spirit: the beings guess the answer for each choice and feel surprise\nRa: not checked\nrulings: L (guess and surprise are shown as the being's own)"},{"id":"M5","g":"M","cc":"none","land":"none","ra":0,"tip":"M5 · Simulated music: Kuramoto phase-locking, just-intonation ratios\ncost: none\nin the beings' world: None. The four valleys tick in lockstep, so there is nothing to be out of step with\nRa: not checked\nrulings: –"},{"id":"M6","g":"M","cc":"none","land":"later","ra":1,"tip":"M6 · Dream rebalancing: higherSelfCue, replay, rebalance, closeLinks\ncost: none (stage 2)\nin the beings' world: In stage 2: between lives (or on a rest), the last season's unresolved episodes are replayed as a cue, never a write\nRa: follows, departs\nrulings: P, A (a cue, never a write), C"},{"id":"M7","g":"M","cc":"none","land":"later","ra":1,"tip":"M7 · Between-life review and the rebirth blend\ncost: none (stage 2)\nin the beings' world: The soul record at a life's end\nRa: follows\nrulings: P, A"},{"id":"M8","g":"M","cc":"a","land":"sense","ra":0,"tip":"M8 · Veil learning and harvest choice\ncost: a\nin the beings' world: A declared observation filter (S2) and a test at cycle ends (H1)\nRa: not checked\nrulings: L"},{"id":"M9","g":"M","cc":"lens","land":"lens","ra":1,"tip":"M9 · Excitement pulls, logic pushes; pain is the result of distorted logic, and fear the…\ncost: lens now (the parts can be computed from the recorded guess and the wants)…\nin the beings' world: In today's mind the value of a guess, U(a) = the sum over answers of guess × wants, with wants = gain minus pain, mixes the owner's pull (the gain part) with a pain term that the owner's sentence has as an output, not an input.…\nRa: partly, follows, silent\nrulings: P (no felt pain: pain enters only through the wants table), J (a…"},{"id":"T1","g":"T","cc":"lens","land":"port","ra":1,"tip":"T1 · The higher-self seat: asked from below, cues dreams, never writes inside\ncost: lens now; rule for the ask\nin the beings' world: The owner in the seat, today read-only telemetry. An ask upward is T13\nRa: follows\nrulings: A, F"},{"id":"T2","g":"T","cc":"rule","land":"port","ra":1,"tip":"T2 · The engine as a teacher; higher-self players ask the parts of the game to change\ncost: rule\nin the beings' world: A protocol over named parts: ask, a part permits, declines or counter-offers within the safety rules, the change is applied and recorded, news of how it landed returns to the asker. See WORLD_V2_DESIGN.md §1. A small instance…\nRa: partly, follows in function\nrulings: P, A, C, J, L, F"},{"id":"T3","g":"T","cc":"run","land":"running","ra":0,"tip":"T3 · The body as the ego's teacher\ncost: run\nin the beings' world: Running in part: the body answers with typed refusals (ERR_EMPTY, ERR_FULL, ERR_SPENT), faints as a protective rest, and the fruit's answer. The being learns by surprise. No pain channel: the body's warnings are information\nRa: not checked\nrulings: P (felt pain is a higher-self choice), L, J"},{"id":"T4","g":"T","cc":"run","land":"running","ra":1,"tip":"T4 · Assimilation throttle, set from above\ncost: run\nin the beings' world: Running: intensity, 1 to 3, held at 2 in measurement runs, lowered only\nRa: follows, departs\nrulings: P"},{"id":"T5","g":"T","cc":"run","land":"running","ra":1,"tip":"T5 · Loop-break\ncost: run\nin the beings' world: Running: on the third collapse from one cause in a life, that being's intensity goes from 2 to 1 for the rest of the life. It acts per being and only lowers\nRa: follows, departs\nrulings: P, C (news of it is logged but returns to no one)"},{"id":"T6","g":"T","cc":"none","land":"later","ra":1,"tip":"T6 · Consent at entry: the catalysts a soul chose\ncost: none (stage 2)\nin the beings' world: The soul line's chose=; the higher self holds the chosen catalysts. Not live (stage 2)\nRa: departs, partly follows\nrulings: P, A"},{"id":"T7","g":"T","cc":"rule","land":"port","ra":0,"tip":"T7 · Separate dials: intensity and irrevocability\ncost: rule\nin the beings' world: Intensity is the one dial now. Irrevocability, whether a being may re-plan mid-life, becomes the ask\nRa: not checked\nrulings: P, A"},{"id":"T8","g":"T","cc":"lens","land":"lens","ra":1,"tip":"T8 · Bake it, taste it\ncost: lens\nin the beings' world: The seat: the owner plays a valley through the same validator (BUILD_STATUS)\nRa: follows in spirit\nrulings: P, F"},{"id":"T9","g":"T","cc":"none","land":"none","ra":1,"tip":"T9 · Welfare over speed, stated\ncost: none\nin the beings' world: A process rule for this project\nRa: departs\nrulings: P"},{"id":"T10","g":"T","cc":"none","land":"none","ra":0,"tip":"T10 · Entities without a soul record get the gentlest tier\ncost: none\nin the beings' world: None. All four beings are named\nRa: not checked\nrulings: P"},{"id":"T11","g":"T","cc":"rule","land":"port","ra":1,"tip":"T11 · The suggestion handshake: a higher rung may only suggest\ncost: rule\nin the beings' world: The counter-offer inside the engine's decision (WORLD_V2_DESIGN.md §1.3)\nRa: follows\nrulings: A, J"},{"id":"T12","g":"T","cc":"rule","land":"port","ra":0,"tip":"T12 · Cause links, gratitude, the peace telegram and forgiveness; karma as inertia braked by…\ncost: rule\nin the beings' world: Gratitude: the donor hears \"your help arrived\", as a count and as information. The help channel has no way back to the donor today (V7 #2)\nRa: not checked\nrulings: C (this is the way back), J (no ratings; counts, not grades), A"},{"id":"T13","g":"T","cc":"rule","land":"port","ra":1,"tip":"T13 · Prayer: the ask turned upward, the answer scaled to the call\ncost: rule\nin the beings' world: A port: an ASK output beside ACTION (masked like ACTION, with a second ledger byte). The answer is scaled to the call, never unasked, and asking costs something\nRa: departs, follows, silent\nrulings: A, C, P, J"},{"id":"T14","g":"T","cc":"rule","land":"world","ra":1,"tip":"T14 · Wanderers: a higher being in a lower role, veiled, joining on a call\ncost: rule + a+; a new world version\nin the beings' world: A being from a later level, born as a fresh character with its memory veiled, seated in an open seat on a group's call\nRa: follows\nrulings: A, C, J"},{"id":"T15","g":"T","cc":"rule","land":"port","ra":1,"tip":"T15 · Five support-crew tiers\ncost: rule\nin the beings' world: The parts of the engine that can be asked (WORLD_V2_DESIGN.md §1.2). Not built\nRa: partly\nrulings: A"},{"id":"T16","g":"T","cc":"rule","land":"world","ra":1,"tip":"T16 · Service-to-self beings as catalyst\ncost: rule; a new world\nin the beings' world: A sense profile or role that offers service-to-self catalyst only to a being whose chose= list names it; intensity only goes down. Not built\nRa: partly, follows, silent\nrulings: P (the door is the recipient's chose=), A, J"},{"id":"T17","g":"T","cc":"rule","land":"port","ra":1,"tip":"T17 · Non-coercion gate\ncost: rule\nin the beings' world: The part's decline reasons (WORLD_V2_DESIGN.md §1.3)\nRa: partly\nrulings: A"},{"id":"T18","g":"T","cc":"run","land":"running","ra":0,"tip":"T18 · The single write gate: only the engine's check writes; a refusal is typed and never…\ncost: run\nin the beings' world: Running at the body (canAct, act, WorldRefusal). It is the template for every part that can be asked: one gate, typed refusals, a ledger line\nRa: not checked\nrulings: A, L, J (a refusal is a typed fact, not a grade)"},{"id":"T19","g":"T","cc":"rule","land":"port","ra":0,"tip":"T19 · The staged change gate: a change to a shared part is kept only if a held-out check…\ncost: rule\nin the beings' world: The rule for an ask that touches something shared (the season table, a sense for everyone): staged, tried, kept only on a check the asker does not run\nRa: not checked\nrulings: A, L"},{"id":"T20","g":"T","cc":"rule","land":"port","ra":0,"tip":"T20 · The inception loop: telemetry flows up, priors flow down\ncost: rule\nin the beings' world: The shape of news and teaching between levels: what the being felt goes up to the seat, what the seat cues goes down\nRa: not checked\nrulings: A, C"},{"id":"T21","g":"T","cc":"rule","land":"port","ra":1,"tip":"T21 · Emergent quests, minted from open causes\ncost: rule\nin the beings' world: A lesson offered, not imposed: when a being's cause stays open, a part may offer the being a smaller or clearer catalyst, which the being may decline\nRa: partly\nrulings: A, J (no verdict on a being that declines), P"},{"id":"T22","g":"T","cc":"lens","land":"lens","ra":0,"tip":"T22 · Precision rises with surprise; antidotes anneal it back\ncost: lens\nin the beings' world: The being's sureness after a surprise. The being already shows surprise (the sting); a sureness number is the lens's to show\nRa: not checked\nrulings: L" function el(tag, cls, html, tip){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; if(tip){ e.setAttribute('data-tip',tip); e.tabIndex=0; e.setAttribute('role','img'); e.setAttribute('aria-label',tip.split('\n')[0]); } return e; }

var tip = document.getElementById('tip');
function showTip(node,x,y){
  var t=node.getAttribute('data-tip'); if(!t) return;
  tip.textContent='';
  t.split('\n').forEach(function(p,i){ var d=document.createElement('div'); if(i===0) d.className='h'; d.textContent=p; tip.appendChild(d); });
  tip.style.display='block';
  var r=tip.getBoundingClientRect(), nx=x+14, ny=y+16;
  if(nx+r.width>innerWidth-8) nx=Math.max(8,innerWidth-r.width-8);
  if(ny+r.height>innerHeight-8) ny=Math.max(8,y-r.height-12);
  tip.style.left=nx+'px'; tip.style.top=ny+'px';
}
document.addEventListener('pointermove',function(e){ var n=e.target.closest&&e.target.closest('[data-tip]'); if(n) showTip(n,e.clientX,e.clientY); else tip.style.display='none'; });
document.addEventListener('pointerdown',function(e){ var n=e.target.closest&&e.target.closest('[data-tip]'); if(n) showTip(n,e.clientX,e.clientY); });
document.addEventListener('focusin',function(e){ var n=e.target.closest&&e.target.closest('[data-tip]'); if(n){ var r=n.getBoundingClientRect(); showTip(n,r.left+r.width/2,r.bottom); } });
document.addEventListener('focusout',function(){ tip.style.display='none'; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') tip.style.display='none'; });
document.addEventListener('pointerleave',function(){ tip.style.display='none'; });

// ---------------- section 3: decisions
sechead('h3',3,'check','3 · The owner\'s decisions\nC-1 to C-6, V-1 and U-1 (WORLD_V2_DESIGN.md, section 3). Star and solid outline: the option I recommend. Dashed outline: also, or if this is what you meant. Faint: the others. Candidates for the owner; nothing here is a ruling.');
