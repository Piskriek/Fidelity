<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fidelity Depth</title>
<link rel="stylesheet" href="/app/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stagewrap"><div id="stage"><canvas id="view"></canvas><canvas id="magic"></canvas></div></div>
<aside id="panel">
  <h1>Fidelity Depth</h1>
  <p class="note">A WoW picture you can look into. How far away each pixel is comes from a model running in this browser (Depth Anything V2 Small), estimated from the picture alone, not read from the game. Move your head, or tick "mouse as head", and the near and far parts slide apart.</p>
  <label for="source">Picture</label>
  <select id="source"><option value="">(loading the reports)</option></select>
  <div class="row">
    <button id="capture" type="button" title="Pick the WoW window: the view follows it live">Capture a window (live)</button>
    <label class="filepick">Open a picture <input type="file" id="file" accept="image/*"></label>
  </div>
  <button id="recal" type="button" title="Sit as you normally would, facing the screen, then press it (or R)">Set my resting position (R)</button>
  <label for="depthamt">Depth (how far the background sits behind the glass)</label><input id="depthamt" type="range" min="1.2" max="8" step="0.1" value="3">
  <label for="focus">On the glass (1 = the nearest thing; lower brings near things out in front)</label><input id="focus" type="range" min="0.3" max="1" step="0.01" value="1">
  <label for="headgain">Head strength</label><input id="headgain" type="range" min="0" max="3" step="0.05" value="1">
  <div class="row">
    <label><input type="checkbox" id="mousehead"> mouse as head</label>
    <label title="M toggles it, C switches to crossed eyes"><input type="checkbox" id="magiceye"> Magic Eye (M)</label>
  </div>
  <div id="status"></div>
</aside>
<script type="module" src="/app/live.js"></script>
</body>
</html>
